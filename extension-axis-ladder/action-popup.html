<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Options Ladder</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="action-popup.css" />
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <img class="popup-mark" id="popup-mark" src="icons/nifty-mark.svg" alt="" width="24" height="24" />
        <div class="popup-brand">
          <strong>OPTIONS LADDER</strong>
          <span class="mono">NIFTY · TRADINGVIEW</span>
        </div>
        <span class="ready-state mono"><i aria-hidden="true"></i>READY</span>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to light theme" aria-pressed="false" title="Switch to light theme">
          <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
          <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </header>

      <section class="market-block" aria-label="Market data status">
        <span class="block-label mono">MARKET DATA</span>
        <div class="market-card">
          <span class="mono">TV AXIS · MANUAL REFRESH</span>
          <i aria-hidden="true"></i>
        </div>
      </section>

      <button class="popup-action primary" id="refresh-ladder" type="button">
        <span class="refresh-icon mono" aria-hidden="true">↻</span>
        <span class="mono" id="refresh-label">REFRESH LADDER</span>
      </button>

      <p class="popup-status mono" id="popup-status" role="status" aria-live="polite">READY TO REFRESH</p>

      <button class="popup-action secondary" id="open-side-panel" type="button">
        <svg class="panel-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><line x1="4" y1="20" x2="4" y2="10"/><line x1="10" y1="20" x2="10" y2="4"/><line x1="16" y1="20" x2="16" y2="13"/><line x1="22" y1="20" x2="2" y2="20"/></svg>
        <span class="mono">OPEN CONTROLS</span>
      </button>
    </main>
    <script src="theme.js"></script>
    <script src="action-popup.js"></script>
  </body>
</html>
